<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lhama Falante · LLAMA + Flask</title>
  <style>
    :root { --bg:#1b1233; --card:#2a1d4a; --ink:#f4f0ff; --muted:#b9aedb; --accent:#ff7ad9; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink);
           display:flex; justify-content:center; padding:32px 16px; }
    .app { width:100%; max-width:680px; }
    h1 { margin:0 0 4px; font-size:1.5rem; }
    .sub { color:var(--muted); font-size:.85rem; margin-bottom:18px; }

    /* GIF + balão de fala com o texto da LLM */
    .palco { position:relative; border-radius:16px; overflow:hidden; line-height:0;
             box-shadow:0 10px 30px rgba(0,0,0,.4); }
    .palco img { width:100%; height:auto; display:block; }
    .balao { position:absolute; left:4%; top:6%; width:52%; line-height:1.3;
             background:#fff; color:#1f2430; padding:14px 16px; border-radius:18px;
             box-shadow:0 4px 14px rgba(0,0,0,.25); }
    .balao::after { content:""; position:absolute; right:-14px; bottom:22px; border:10px solid transparent;
                    border-left:16px solid #fff; border-right:0; }
    .balao .frase { font-size:1.15rem; font-weight:700; }
    .balao .traducao { font-size:.9rem; color:#4b5563; margin-top:6px; font-style:italic; }
    .balao.carregando .frase { opacity:.6; }
    .balao.erro { background:#fee2e2; color:#991b1b; }

    .controles { background:var(--card); padding:18px; border-radius:14px; margin-top:16px;
                 display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    label { display:block; font-size:.72rem; font-weight:600; margin-bottom:5px;
            text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
    select { width:100%; padding:10px; border:1px solid #4b3a7a; border-radius:8px;
             font-size:1rem; background:#1b1233; color:var(--ink); }
    button.run { grid-column:1 / -1; padding:13px; border:0; border-radius:8px;
                 background:var(--accent); color:#2a0a22; font-size:1rem; font-weight:700; cursor:pointer; }
    button.run:disabled { opacity:.6; cursor:wait; }
    details { margin-top:14px; font-size:.82rem; color:var(--muted); }
    pre { background:#120b24; padding:12px; border-radius:8px; overflow:auto; color:#d6ccff; line-height:1.4; }
  </style>
</head>
<body>
  <div class="app">
    <h1>🦙 Lhama Falante</h1>
    <div class="sub">Provedor: {{ provedor }}</div>

    <div class="palco">
      <img src="/static/llama.gif" alt="Lhama animada">
      <div class="balao carregando" id="balao">
        <div class="frase" id="frase">Pensando...</div>
        <div class="traducao" id="traducao"></div>
      </div>
    </div>

    <div class="controles">
      <div>
        <label for="idioma">Idioma</label>
        <select id="idioma">
          {% for i in idiomas %}<option>{{ i }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label for="comportamento">Comportamento</label>
        <select id="comportamento">
          {% for c in comportamentos %}<option>{{ c }}</option>{% endfor %}
        </select>
      </div>
      <button class="run" id="run">Run</button>
    </div>

    <details>
      <summary>Detalhes técnicos (prompt e JSON da API)</summary>
      <pre id="json">—</pre>
    </details>
  </div>

<script>
  const $ = id => document.getElementById(id);

  async function gerar() {
    const btn = $("run"), balao = $("balao");
    btn.disabled = true; btn.textContent = "Gerando...";
    balao.className = "balao carregando"; $("frase").textContent = "Pensando..."; $("traducao").textContent = "";
    try {
      const r = await fetch("/api/gerar", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ idioma: $("idioma").value, comportamento: $("comportamento").value }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.erro || "Erro desconhecido");
      balao.className = "balao";
      $("frase").textContent = d.frase;            // textContent: evita injetar HTML vindo da LLM
      $("traducao").textContent = d.traducao;
      $("json").textContent = JSON.stringify(d, null, 2);
    } catch (err) {
      balao.className = "balao erro";
      $("frase").textContent = err.message;
    } finally {
      btn.disabled = false; btn.textContent = "Run";
    }
  }

  $("run").addEventListener("click", gerar);
  gerar();   // ao abrir o link, já gera o primeiro texto e coloca no GIF
</script>
</body>
</html>
